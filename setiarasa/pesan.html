<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesan Online - Setia Rasa</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <img src="assets/img/logo.png" alt="Setia Rasa Logo" />
        <h1>Setia Rasa</h1>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="tentang.html">Tentang</a></li>
          <li><a href="testimoni.html">Testimoni</a></li>
          <li><a href="kontak.html">Kontak</a></li>
          <li><a href="pesan.html" class="active order-btn">Pesan Online</a></li>
        </ul>
      </nav>
      <div class="hamburger-menu" id="hamburgerMenu">
        <span></span><span></span><span></span>
      </div>
    </div>
  </header>

  <!-- FORM PEMESANAN -->
  <section class="order-section">
    <div class="container">
      <h2>Pesan Makanan Favorit Anda</h2>
      <a href="#" class="back-button">← Kembali</a>
      <p class="subtitle">Isi data di bawah ini dan nikmati cita rasa Nusantara dari Setia Rasa.</p>

      <form id="orderForm" class="order-form-container">
        <div class="order-form">
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required />
          </div>
  
          <div class="form-group">
            <label for="telepon">Nomor Telepon</label>
            <input type="tel" id="telepon" placeholder="Contoh: 0812xxxxxxx" required />
          </div>
  
          <div class="form-group form-full-width">
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" placeholder="Masukkan alamat pengantaran" required></textarea>
          </div>
  
          <div class="form-group form-full-width">
            <label>Menu yang Dipesan</label>
            <div id="cartItems" class="cart-items-container"></div>
          </div>
          <div class="form-group form-full-width">
            <label for="pembayaran">Metode Pembayaran</label>
            <select id="pembayaran" required>
              <option value="">-- Pilih Metode --</option>
              <option value="COD">Bayar di Tempat (COD)</option>
              <option value="Transfer Bank">Transfer Bank</option>
              <option value="E-Wallet">E-Wallet (Dana, ShopeePay, GoPay)</option>
            </select>
          </div>
  
          <div class="form-group form-full-width">
            <label for="catatan">Catatan (Opsional)</label>
            <textarea id="catatan" placeholder="Contoh: Tanpa sambal, pedas sedang, dsb."></textarea>
          </div>
        </div>
        <button type="submit" class="btn">Pesan Sekarang</button>
      </form>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© 2025 Setia Rasa. Semua hak dilindungi.</p>
      <div class="footer-socials">
        <a href="#">Instagram</a> · 
        <a href="#">Facebook</a> · 
        <a href="#">Tiktok</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
